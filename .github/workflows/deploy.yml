name: Deploy Finances

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finances-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy production
    runs-on: [self-hosted, linux, x64, finances-jupiter]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: bash scripts/deploy-production.sh
