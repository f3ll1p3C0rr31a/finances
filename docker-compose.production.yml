# Produção (Saturno, CT 101 "ct-web").
#
# Os caminhos absolutos do servidor entram por FINANCES_APP_DIR para que o
# mesmo arquivo sirva a dois lugares: o deploy roda dentro de
# /dados/sites/finances/app (variável ausente → "."), e a cópia usada pelo
# Dockge vive em /opt/stacks/finances, onde o .env define a variável apontando
# para o checkout.
services:
  postgres:
    image: postgres:16-alpine
    container_name: finances-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    volumes:
      - finances_postgres_data:/var/lib/postgresql/data
    networks: [interna]

  app:
    build:
      context: ${FINANCES_APP_DIR:-.}
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
    image: finances-app:latest
    container_name: finances-app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ${FINANCES_APP_DIR:-.}/.env
    environment:
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      TZ: America/Sao_Paulo
    ports:
      - "8092:3000"
    networks: [interna]

volumes:
  # Criado na migração do Jupiter e preenchido com os dados reais; nunca
  # deixar o Compose criar um volume novo por baixo (finances_finances_*).
  finances_postgres_data:
    external: true

networks:
  interna:
